<!DOCTYPE html>
<!--
  Threshold curve editor (app_hazard): one self-contained page. The curves, handles, year dials and
  controls all run in the script below: no R, no Shiny, nothing to load but this file.
  Try it by opening the file in a browser (double-click it, or drag it into a window).
  On the site, tools/build_static.R copies it to site/articles/apps/hazard.html and shows it in an iframe
  in article 201, in hazard.html and on the full-window page hazard-app.html.
  app_hazard/app.R is the Shiny version this page came from, kept for reference.

  Curve interpolated in VALUE space (cubic Hermite on value vs fx), mapped through the y-axis for
  drawing, so it bends where it crosses a decade band. The hazard set (red) drives: anchors (value +
  slope) and optional per-segment controls give hazard(fx); survival is derived by S = prod(1-h)^dy.
  Population (pink) is an independent input curve. Default hazard peaks around year 20.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Threshold curve editor</title>
<style>
/* ── base: the parts of Shiny's Bootstrap 3 the page relied on, so it looks as it did under Shiny ── */
*, *::before, *::after{box-sizing:border-box;}
html{-webkit-text-size-adjust:100%;}
body{margin:0;font-size:14px;line-height:1.42857143;}
.page{padding:0 15px;}                              /* Shiny's container-fluid gutter */
h3{font-size:24px;line-height:1.1;margin:20px 0 10px;}
button,input{font:inherit;color:inherit;margin:0;}
label{display:inline-block;max-width:100%;margin-bottom:5px;}
.checkbox label{display:inline-flex;align-items:center;min-height:20px;margin:0;cursor:pointer;}
.checkbox input{margin:0 7px 0 0;cursor:pointer;}

/* ── the app (as app_hazard/app.R) ── */
body,.page{background:#0b3552; color:#e8eef4; font-family:Arial,Helvetica,sans-serif;}
h3{color:#e8eef4; font-weight:700;}
a{color:#78e6e7;}
label,.control-label,.checkbox label{color:#e8eef4; font-weight:400;}
#overlay{position:absolute; top:0; left:0; width:100%; height:100%; z-index:10; touch-action:none; overflow:visible;}
#overlay text{user-select:none;}
#popout .pcell{line-height:1.55; max-width:210px;}
#popout .pcell b{color:#f18fbe;}
#popout .was{color:#9a6580; font-style:italic;}
.cmprow{margin:4px 0 8px;}
.cmpbtn{background:#12405f;color:#e8eef4;border:1px solid #2a6a8f;border-radius:6px;padding:6px 12px;font-size:13px;cursor:pointer;margin-right:8px;}
.cmpbtn:hover{background:#175981;}
.cmpbtn:disabled{opacity:0.4;cursor:default;background:#12405f;}
.cmpbtn.active{background:#1f77a8;border-color:#8fd6f2;color:#fff;box-shadow:0 0 0 1px #8fd6f2 inset;}
.legendrow{display:flex;align-items:center;gap:2px 22px;flex-wrap:wrap;margin:4px 0 10px;font-size:13.5px;}
.legendrow .checkbox{margin:0;}
.ctrlbar{display:flex;flex-wrap:wrap;align-items:center;gap:4px 26px;margin:6px 0 12px;}
.ctrlbar .checkbox{margin:0;}
.ctrlbar .fontctl .control-label{margin:0 0 1px;font-weight:400;}
.wheel svg text{user-select:none;}
.wheel svg:active{cursor:grabbing;}
.startyr .syrbig{font-size:15px;font-weight:bold;color:#cdd9e3;margin-top:42px;}
.startyr .syrsub{font-size:10px;color:#8fa3b3;margin-top:2px;}
.wheel .yrin{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:58px;
  background:transparent;border:none;color:#ffd9e4;font-weight:bold;font-size:13px;
  text-align:center;font-family:inherit;padding:1px 0;outline:none;}
.wheel .yrin:focus{background:rgba(0,0,0,0.45);border-radius:4px;}
/* font-size slider: a native range input drawn like the Shiny slider it replaces: the value in a bubble over
   the handle, the end values in the top corners (each hidden while the bubble covers it — drawFontSlider),
   the track filled up to the handle (--fill, set by drawFontSlider; Firefox fills it natively) */
.rslider{position:relative;width:220px;height:40px;}
.rslider .rs-lbl{position:absolute;top:0;padding:1px 3px;border-radius:3px;font-size:10px;line-height:1.333;
  color:#0b3552;background:#4fb8d6;white-space:nowrap;pointer-events:none;}
.rslider .rs-min{left:0;}
.rslider .rs-max{right:0;}
.rslider .rs-val{font-size:11px;transform:translateX(-50%);}
.rslider input{position:absolute;left:0;top:17px;width:100%;height:22px;margin:0;background:transparent;
  -webkit-appearance:none;appearance:none;cursor:pointer;}
.rslider input:focus{outline:none;}
.rslider input:focus-visible::-webkit-slider-thumb{box-shadow:0 0 0 3px rgba(79,184,214,.4);}
.rslider input:focus-visible::-moz-range-thumb{box-shadow:0 0 0 3px rgba(79,184,214,.4);}
.rslider input::-webkit-slider-runnable-track{height:8px;border:1px solid #12405f;border-radius:8px;
  background:linear-gradient(#4fb8d6, #4fb8d6) 0 0 / var(--fill, 50%) 100% no-repeat, #12405f;}
.rslider input::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;margin-top:-7px;border-radius:50%;
  background:#e8eef4;border:1px solid #ababab;box-shadow:1px 1px 3px rgba(255,255,255,.3);}
.rslider input::-moz-range-track{height:8px;border:1px solid #12405f;border-radius:8px;background:#12405f;}
.rslider input::-moz-range-progress{height:8px;border-radius:8px 0 0 8px;background:#4fb8d6;}
.rslider input::-moz-range-thumb{width:22px;height:22px;border-radius:50%;background:#e8eef4;border:1px solid #ababab;
  box-sizing:border-box;box-shadow:1px 1px 3px rgba(255,255,255,.3);}
</style>
</head>
<body>
<div class="page">
  <h3>Extinction probability threshold controls</h3>
  <div class="ctrlbar">
    <div class="checkbox"><label><input id="no_ctrl" type="checkbox" checked autocomplete="off"><span>No control point</span></label></div>
    <div class="checkbox"><label><input id="split_slope" type="checkbox" checked autocomplete="off"><span>Split slopes</span></label></div>
    <div class="checkbox"><label><input id="linear_y" type="checkbox" checked autocomplete="off"><span>Linear y scale (10x ceiling)</span></label></div>
    <div class="checkbox"><label><input id="linear_x" type="checkbox" checked autocomplete="off"><span>Linear x-scale</span></label></div>
    <div class="checkbox"><label><input id="lines_only" type="checkbox" autocomplete="off"><span>Lines only</span></label></div>
    <div class="checkbox"><label><input id="log_time" type="checkbox" autocomplete="off"><span>Logarithmic time within each period</span></label></div>
    <div class="fontctl">
      <label class="control-label" for="font">Font size (px)</label>
      <div class="rslider">
        <span class="rs-lbl rs-min"></span><span class="rs-lbl rs-max"></span><span class="rs-lbl rs-val"></span>
        <input id="font" type="range" min="8" max="28" step="1" value="15" autocomplete="off">
      </div>
    </div>
  </div>
  <div class="legendrow">
    <div class="checkbox"><label><input id="vis_haz" type="checkbox" checked autocomplete="off"><b style='color:#e8836f'>Extinction probability</b></label></div>
    <div class="checkbox"><label><input id="vis_surv" type="checkbox" checked autocomplete="off"><b style='color:#4fb8d6'>Survival probability</b></label></div>
    <div class="checkbox"><label><input id="vis_pop" type="checkbox" checked autocomplete="off"><b style='color:#e46ba6'>Population (potential / expected)</b></label></div>
    <div class="checkbox"><label><input id="vis_cumyr" type="checkbox" autocomplete="off"><b style='color:#6fcf97'>Cumulative survived years</b></label></div>
    <div class="checkbox"><label><input id="vis_cumly" type="checkbox" autocomplete="off"><b style='color:#e8b04f'>Cumulative life-years</b></label></div>
    <div class="checkbox"><label><input id="vis_cumlives" type="checkbox" autocomplete="off"><b style='color:#b98fe0'>Cumulative lives (&divide;75)</b></label></div>
  </div>
  <div class="cmprow">
    <button id="baseCur" type="button" class="cmpbtn">Baseline = current</button>
    <button id="basePrev" type="button" class="cmpbtn">Baseline = previous</button>
    <button id="reset" type="button" class="cmpbtn">Reset</button>
    <span style="display:inline-block;width:18px;"></span>
    <button id="remYr" type="button" class="cmpbtn">Remove last year</button>
    <button id="addYr" type="button" class="cmpbtn">Add new year</button>
  </div>
  <!-- #chartcol carries the axis gutters as padding (widths set by layoutLanes() in the script); the rows inside
       share its content box, so the wheels, plot and population cells stay aligned with the plot edges.
       1240 x 698 is the plot size in user units (W0 / H0 in the script); the width matches the x-risk app. -->
  <div id="chartcol" style="padding:0 60px; max-width:1240px; box-sizing:content-box;">
    <div id="wheelrow" style="position:relative; width:100%; max-width:1240px; height:126px; margin-bottom:2px;"></div>
    <div id="plotwrap" style="position:relative; width:100%; max-width:1240px; aspect-ratio:1240/698; margin-top:55px;">
      <div style="position:absolute; inset:0; background:#0b3552;"></div>   <!-- dark panel; every curve and area is drawn by the SVG overlay -->
      <svg id="overlay" style="width:100%;height:100%;"></svg>   <!-- overflow:visible lets the axis labels (gutters) and the year labels sit outside -->
    </div>
    <div id="popout" style="position:relative; margin:12px 0; width:100%; max-width:1240px; min-height:140px; font-size:12px; color:#e46ba6;"></div>
  </div>
  <div id="live" style="margin:8px 0; font-family:monospace; color:#cdd9e3;"></div>
</div>
<script>
(function(){
  const NS="http://www.w3.org/2000/svg";
  const HAZ="#e8836f", SUR="#4fb8d6", HBAR="#c96f5c", SBAR="#3f9ab5";
  const POP="#e46ba6", PBAR="#a84e7d";
  const CYR="#6fcf97", CLY="#e8b04f", CLV="#b98fe0";   // cumulative: survived years / life-years / lives
  let popMax=1e10;    // population axis ceiling; grows by decades (10 B, 100 B, ...)
  const POP_DEFAULT={ anchors:[8.3e9,8.3e9,8.3e9,8.3e9,8.3e9], thetaL:[0,0,0,0,0], thetaR:[0,0,0,0,0], fxc:[0.5,0.5,0.5,0.5], cval:[8.3e9,8.3e9,8.3e9,8.3e9] };
  const PAL=["#1a9850","#91cf60","#fdae61","#d73027"];
  const YRS0=[2026,2050,2100];                         // default checkpoints: fixed 2026 start + 2 wheels (add up to 5)
  let yearVals=YRS0.slice();                            // current (wheel-adjustable) checkpoint years
  let SPANX=[10,90,900,9000];                           // period lengths = diffs of yearVals (mutated in place)
  const WHEEL_FLOOR=2*YRS0[0]-YRS0[1], WHEEL_CEIL=1e6;   // first end mirrored; last end reaches year 1,000,000
  function recomputeSpanx(){ for(let s=0;s<ns();s++) SPANX[s]=yearVals[s+1]-yearVals[s]; }
  function yearRange(i){ const last=yearVals.length-1;
    if(i===0) return [WHEEL_FLOOR, yearVals[1]];
    if(i===last) return [yearVals[last-1], WHEEL_CEIL]; return [yearVals[i-1], yearVals[i+1]]; }
  // only the last knob is logarithmic (in ELAPSED years from the 2026 start, so its long
  // horizon spreads across the dial); the interior knobs interpolate linearly between neighbours.
  function isLogWheel(i){ return i===yearVals.length-1; }
  function yearFromFrac(i,f){ const r=yearRange(i);
    if(isLogWheel(i)){ const st=yearVals[0], eLo=Math.max(1,r[0]-st), eHi=Math.max(eLo+1,r[1]-st); return st+eLo*Math.pow(eHi/eLo,f); }
    return r[0]+f*(r[1]-r[0]); }
  function fracFromYear(i,y){ const r=yearRange(i);
    if(isLogWheel(i)){ const st=yearVals[0], eLo=Math.max(1,r[0]-st), eHi=Math.max(eLo+1,r[1]-st), e=Math.max(eLo,y-st); return Math.log(e/eLo)/Math.log(eHi/eLo); }
    return (y-r[0])/(r[1]-r[0]); }
  function fmtYearShort(y){ y=Math.round(y);                          // compact for the small dial labels
    if(y>=1e9) return (y/1e9)+"B"; if(y>=1e6) return Math.round(y/1e6)+"M"; return y.toLocaleString(); }
  function np(){ return yearVals.length; }             // active checkpoint count (2..5)
  function ns(){ return yearVals.length-1; }           // active segment count
  // checkpoint i -> x-fraction [0,1]. equal periods (default) or linear-in-years when linearX.
  function cpFx(i){ const n=ns(); if(linearX){ const sp=yearVals[n]-yearVals[0]; if(sp>0) return (yearVals[i]-yearVals[0])/sp; } return i/n; }
  const M=100, GRAB=15, LEV=34, LIN_EMIN=-5, LIN_EMAX=-1;
  const EDGE_IN=9;   // inset (user units, ~one digit) for the first/last checkpoint readouts
  const YDEAD=5;   // px of sideways travel ignored before an anchor drag starts moving its year (keeps vertical drags from drifting)
  let showPoints=true, useCtrl=false, split=true, linearY=true, logTime=false, linearX=true, driver="hazard";
  // which handle family was grabbed last: "hazard" (normal view) or "pop" (population readouts shown at every
  // checkpoint, the hazard/survival readouts faded to 30% so the numbers stay readable). Flips on the next grab.
  let focusSet="hazard";
  let visHaz=true, visSurv=true, visPop=true, visCumYr=false, visCumLy=false, visCumLives=false;
  let minorGrid=[];
  const MINOR_GAP=40;   // closest spacing of the minor time gridlines (user units, of the plot's 1240)
  function niceYears(x){ if(!(x>1)) return 1;   // smallest of 1, 2, 5 x 10^k years that is >= x
    const p=Math.pow(10,Math.floor(Math.log10(x))), m=x/p; return (m<=1?1:m<=2?2:m<=5?5:10)*p; }
  function tFrac(u){ return logTime ? (Math.pow(10,u)-1)/9 : u; }   // log: single decade of time per span
  let linExp=-1, linMax=0.1;
  // Scale transitions (linear hazard scale + population scale): the plot spans 0..TOPF x the scale max, i.e. 11
  // grid units of which the top one (10..11, unlabeled) is a red transition zone; the bottom 10% is another.
  // Releasing a handle inside the top zone grows that scale a decade; releasing with EVERY current value of that
  // variable inside the bottom zone shrinks it to fit. Baseline ("previous") values never count. See fitExp().
  const TOPF=1.1, ZONE_FILL="rgba(255,0,0,0.2)";
  let W,H, hazSet={anchors:[],ctrls:[]}, survSet={anchors:[],ctrls:[]}, popSet={anchors:[],ctrls:[]}, hazS=[], survS=[], popS=[];
  let surTicks=[];   // survival axis labels (right gutter)
  let yTicks=[], popTicks=[], cumYrTicks=[], cumLyTicks=[], cumLvTicks=[], infoTx=[], bandsG, bandSig="", svg, label, hazArea, hazLine, surLine, popLine, expLine, segSep=[], connLines=[], ptLabels=[], drag=null;
  let baseHazLine, baseSurLine, basePopLine, baseExpLine, cumYrLine, cumLyLine, cumLvLine;
  let baseCumYrLine, baseCumLyLine, baseCumLvLine;
  let baseMode="previous", baseSnap=null, prevSnap=null;   // comparison: "none" | "current" | "previous"

  const clampHaz=h=>Math.max(1e-5,Math.min(1e-1,h)), clamp01=v=>Math.max(0,Math.min(1,v)), sX=fx=>fx*W;
  function hazToFyDec(h){ h=clampHaz(h); let seg=Math.min(3,Math.max(0,Math.floor(Math.log10(h))+5));
    const lo=Math.pow(10,seg-5),hi=Math.pow(10,seg-4); return (seg+Math.max(0,Math.min(1,(h-lo)/(hi-lo))))/4; }
  const sYh=h=>linearY?(1-clamp01(h/(linMax*TOPF)))*H:(1-hazToFyDec(h))*H;
  const hazFromFy=fy=>linearY?clampHaz(clamp01(fy)*linMax*TOPF):(function(){let seg=Math.min(3,Math.floor(clamp01(fy)*4)),frac=clamp01(fy)*4-seg,
    lo=Math.pow(10,seg-5),hi=Math.pow(10,seg-4);return lo+frac*(hi-lo);})();
  const survTop=()=>linearY?TOPF:1;   // survival 100% sits on the 10th tick, under the top transition zone (full height in decade mode)
  const sYs=s=>(1-s/survTop())*H;
  const ratio=h=>Math.round(1/clampHaz(h)).toLocaleString();
  function foldClamp(a){ if(a>Math.PI/2)a-=Math.PI; else if(a<-Math.PI/2)a+=Math.PI; return Math.max(-1.35,Math.min(1.35,a)); }
  function herm(px,x0,y0,m0,x1,y1,m1){ const h=x1-x0,u=(px-x0)/h;
    return y0*(2*u*u*u-3*u*u+1)+m0*h*(u*u*u-2*u*u+u)+y1*(-2*u*u*u+3*u*u)+m1*h*(u*u*u-u*u); }
  function dScreenYdh(h){ if(linearY) return -H/(linMax*TOPF); h=clampHaz(h);
    const seg=Math.min(3,Math.max(0,Math.floor(Math.log10(h))+5)),lo=Math.pow(10,seg-5),hi=Math.pow(10,seg-4); return -(H/4)/(hi-lo); }
  // variable descriptors
  const HDESC={ yOf:sYh,        invY:py=>hazFromFy(1-py/H), clampV:clampHaz, dYdv:dScreenYdh, col:HAZ, bar:HBAR, ratioLbl:v=>"1 in "+ratio(v)+" ("+(v*100).toFixed(4)+"%)" };
  const SDESC={ yOf:sYs, invY:py=>clamp01((1-py/H)*survTop()), clampV:clamp01, dYdv:()=> -H/survTop(),      col:SUR, bar:SBAR, ratioLbl:v=>(v*100).toFixed(1)+"% surv" };
  const sYp = p=>(1-clamp01(p/(popMax*TOPF)))*H;
  const PDESC={ yOf:sYp, invY:py=>clamp01(1-py/H)*popMax*TOPF, clampV:p=>Math.max(0,Math.min(1e15,p)), dYdv:()=>-H/(popMax*TOPF), col:POP, bar:PBAR, ratioLbl:v=>Math.round(v/1e6).toLocaleString()+" M pop" };
  function maxPopVal(){ let m=0; for(let i=0;i<np();i++){ if(popSet.anchors[i].val>m)m=popSet.anchors[i].val; } popS.forEach(p=>{ if(p.val>m)m=p.val; }); return m; }
  // new decade exponent for a scale whose max is 10^cur: a value in the top zone (above the scale max) -> one decade
  // up; every value inside the bottom zone (below 10% of the max) -> shrink until the max is above 10%; else unchanged.
  function fitExp(mx, cur, lo, hi){ let e=cur;
    if(mx>Math.pow(10,e)) e=Math.ceil(Math.log10(mx));
    else if(mx>0&&mx<0.1*Math.pow(10,e)) e=Math.floor(Math.log10(mx))+1;
    return Math.max(lo,Math.min(hi,e)); }
  function fitPop(){ popMax=Math.pow(10, fitExp(maxPopVal(), Math.round(Math.log10(popMax)), 10, 14)); }
  // A scale change must not change any value: the lever angles are screen-space, so the value-space slope they
  // encode (tan(theta) * W / dYdv, with dYdv proportional to 1/scaleMax) would otherwise change with the scale.
  // Re-express every lever so its value slope is preserved: tan(new) = tan(old) * oldMax / newMax. The result may
  // exceed the angle range the mouse can reach (that is fine - the curve is what matters, not reproducibility).
  function rescaleLevers(set, factor){ const lim=Math.PI/2-0.01;
    set.anchors.forEach(a=>{ a.thetaL=Math.max(-lim,Math.min(lim,Math.atan(Math.tan(a.thetaL)*factor)));
                             a.thetaR=Math.max(-lim,Math.min(lim,Math.atan(Math.tan(a.thetaR)*factor))); }); }
  // comparison baseline snapshot (sampled value arrays, aligned by index)
  function snap(){ return { fx:hazS.map(p=>p.fx), haz:hazS.map(p=>p.val), surv:survS.map(p=>p.val), pop:popS.map(p=>p.val), dy:popS.map(p=>p.dy) }; }
  function activeBase(){ return baseMode==="previous"?prevSnap:(baseMode==="current"?baseSnap:null); }
  function curveValAt2(fxA,valA,fx){ if(fx<=fxA[0])return valA[0]; for(let i=1;i<fxA.length;i++){ if(fxA[i]>=fx){ const t=(fx-fxA[i-1])/(fxA[i]-fxA[i-1]); return valA[i-1]+t*(valA[i]-valA[i-1]); } } return valA[valA.length-1]; }
  // stack labels so higher value sits higher (smaller y) with a minimum gap
  function stackByValue(items,gap){ items.sort((a,b)=>b.val-a.val); for(let i=1;i<items.length;i++){ if(items[i].y<items[i-1].y+gap) items[i].y=items[i-1].y+gap; } return items; }
  function updateCmpBtns(){ const c=document.getElementById("baseCur"), p=document.getElementById("basePrev");
    if(c) c.classList.toggle("active", baseMode==="current"); if(p) p.classList.toggle("active", baseMode==="previous"); }
  function setByName(n){ return n==="hazard"?hazSet:(n==="pop"?popSet:survSet); }
  function descByName(n){ return n==="hazard"?HDESC:(n==="pop"?PDESC:SDESC); }
  function fmtM(v){ return Math.round(v/1e6).toLocaleString(); }
  function fmtBig(v){ const a=Math.abs(v); if(a>=1e12)return (v/1e12).toFixed(2)+" T"; if(a>=1e9)return (v/1e9).toFixed(2)+" B"; if(a>=1e6)return (v/1e6).toFixed(1)+" M"; return Math.round(v).toLocaleString(); }
  function pctLbl(v){ const p=v*100; if(p<=0) return "0%"; let t=parseFloat(p.toPrecision(3)).toString();   // axis labels: 3 sig. figs, no trailing zeros
    if(t.indexOf("e")>=0) t=p.toFixed(8).replace(/0+$/,""); return t+"%"; }

  function mk(t,a){ const e=document.createElementNS(NS,t); for(const k in a) e.setAttribute(k,a[k]); return e; }
  function mouse(e){ const r=svg.getBoundingClientRect(); return {x:(e.clientX-r.left)*(W/r.width), y:(e.clientY-r.top)*(H/r.height)}; }
  function setFont(px){ let st=document.getElementById("ovFont"); if(!st){ st=document.createElement("style"); st.id="ovFont"; document.head.appendChild(st); }
    st.textContent="#overlay text{font-size:"+px+"px;}"; }   // one CSS rule overrides every SVG label
  function maxHaz(){ let m=0; for(let i=0;i<np();i++){ if(hazSet.anchors[i].val>m) m=hazSet.anchors[i].val; }
    if(useCtrl) for(let s=0;s<ns();s++){ if(hazSet.ctrls[s].val>m) m=hazSet.ctrls[s].val; } hazS.forEach(p=>{ if(p.val>m) m=p.val; }); return m; }   // every current hazard value (handles + curve)
  // when a baseline is shown, the scale must also cover its values so the ghost lines aren't clipped
  function baseMaxHaz(){ const B=activeBase(); let m=0; if(B) B.haz.forEach(v=>{ if(v>m) m=v; }); return m; }
  function baseMaxPop(){ const B=activeBase(); let m=0; if(B) B.pop.forEach(v=>{ if(v>m) m=v; }); return m; }
  function setLinExp(e){ e=Math.max(LIN_EMIN,Math.min(LIN_EMAX,e)); linExp=e; linMax=Math.pow(10,e); }
  function fitLinExp(){ setLinExp(fitExp(maxHaz(), linExp, LIN_EMIN, LIN_EMAX)); }

  // Gutter axes, identical on both sides: every visible label is placed beside its gridline (labels that would overlap
  // are stacked, see layoutSide) and a bracket (tick from the plot edge + spine along the stack) ties them to that line. Hidden curves drop their labels. The primary

          // its neighbours' x); otherwise (equal periods, or the last anchor pinned to the right edge) one column = one sweep
          const pxf=(linearX&&i<np()-1)?Math.max(1,(cpFx(i+1)-cpFx(i-1))*W):W/ns();
          setYearFrac(i, drag.f0+eff/pxf); }
        set.anchors[i].val=desc.clampV(desc.invY(m.y)); redraw();   // may sit in the top zone (above the scale max) until release
        document.getElementById("live").textContent=drag.set+" "+yearVals[i]+": "+desc.ratioLbl(set.anchors[i].val);
      } else if(drag.type==="rR"){ const a=foldClamp(Math.atan2(m.y-cy,m.x-cx)); set.anchors[i].thetaR=a; if(!split) set.anchors[i].thetaL=a; redraw();
        document.getElementById("live").textContent=drag.set+" "+yearVals[i]+(split?": outgoing slope":": slope");
      } else if(drag.type==="rL"){ const a=foldClamp(Math.atan2(cy-m.y,cx-m.x)); set.anchors[i].thetaL=a; if(!split) set.anchors[i].thetaR=a; redraw();
        document.getElementById("live").textContent=drag.set+" "+yearVals[i]+(split?": incoming slope":": slope");
      } else { const s=i, fxL=cpFx(s), fxR=cpFx(s+1), segw=fxR-fxL||1e-6;
        set.ctrls[s].fxc=Math.max(0.02,Math.min(0.98,(m.x/W-fxL)/segw)); set.ctrls[s].val=desc.clampV(desc.invY(m.y)); redraw();   // within-segment fraction
        document.getElementById("live").textContent=drag.set+" segment "+(s+1)+" control: through "+desc.ratioLbl(set.ctrls[s].val); }
    };
    const end = e => { if(!drag) return;
      // release: apply the transition zones of the set that was dragged (top zone -> decade up, all-in-bottom-zone -> shrink)
      let msg=""; if(drag.set==="hazard"&&linearY){ const o=linMax; fitLinExp(); if(linMax!==o){ rescaleLevers(hazSet, o/linMax); msg="hazard scale -> "+pctLbl(linMax); } }
      else if(drag.set==="pop"){ const o=popMax; fitPop(); if(popMax!==o){ rescaleLevers(popSet, o/popMax); msg="population scale -> "+fmtBig(popMax); } }
      label.textContent="";
      document.getElementById("live").textContent=msg; drag=null; redraw(); };
    svg.onpointerup=end; svg.onpointercancel=end;
  }

  // ---- defaults, the page's controls and start-up (under Shiny the server sent these as messages) ----
  const W0=1240, H0=698;   // plot size in user units (the page's #chartcol / #plotwrap sizes match)
  // Default hazard: rises early then declines over the long tail (5 checkpoints, 4 segments; 2036 = 0.07%).
  // Each lever starts along the line through its neighbouring anchors, as drawn on the decade scale.
  function defaultTheta(anchors){ const py=anchors.map(h=>(1-hazToFyDec(h))*H0);
    return anchors.map((_,i)=>{ const lo=Math.max(0,i-1), hi=Math.min(4,i+1); return Math.atan2(py[hi]-py[lo], (hi-lo)/4*W0); }); }
  const HZ_ANCHORS=[1e-4,7e-4,3e-4,8e-5,3e-5];
  const HZ0={ anchors:HZ_ANCHORS, thetaL:defaultTheta(HZ_ANCHORS), thetaR:defaultTheta(HZ_ANCHORS),
              fxc:[0.5,0.5,0.5,0.5], cval:[(1e-4+7e-4)/2,(7e-4+3e-4)/2,(3e-4+8e-5)/2,(8e-5+3e-5)/2] };   // fxc = within-segment fraction
  const SV0={ anchors:[0.98,0.92,0.75,0.50,0.30], thetaL:[0,0,0,0,0], thetaR:[0,0,0,0,0],
              fxc:[0.5,0.5,0.5,0.5], cval:[0.95,0.83,0.62,0.40] };

  // Reset: default curves, default years (YRS0), population scale back to 10 B.
  function resetAll(){ driver="hazard"; focusSet="hazard"; loadSet(hazSet,HZ0); loadSet(survSet,SV0); loadSet(popSet,POP_DEFAULT); popMax=1e10;
    yearVals=YRS0.slice(); recomputeSpanx(); buildWheels(); updateYearBtns();
    if(linearY) fitLinExp(); redraw(); prevSnap=snap(); }
  // Read every checkbox and the font slider into the drawing state, then redraw.
  const isOn=id=>{ const el=document.getElementById(id); return !!(el&&el.checked); };
  function applyParams(){ showPoints=!isOn("lines_only"); useCtrl=!isOn("no_ctrl"); linearY=isOn("linear_y"); logTime=isOn("log_time");
    const w=split; split=isOn("split_slope");
    const lx=linearX; linearX=isOn("linear_x");
    visHaz=isOn("vis_haz"); visSurv=isOn("vis_surv"); visPop=isOn("vis_pop"); visCumYr=isOn("vis_cumyr"); visCumLy=isOn("vis_cumly"); visCumLives=isOn("vis_cumlives");
    setFont(+document.getElementById("font").value);
    if(!split&&w){ [hazSet,survSet].forEach(S=>S.anchors.forEach(a=>{ const avg=(a.thetaL+a.thetaR)/2; a.thetaL=avg; a.thetaR=avg; })); }
    if(svg){ if(linearY) fitLinExp(); redraw(); if(linearX!==lx){ drawAllWheels(); prevSnap=snap(); redraw(); } } }
  document.addEventListener("change", e=>{ const t=e.target;
    if(!t.matches(".ctrlbar input[type=checkbox], .legendrow input[type=checkbox]")) return;
    // cumulative life-years and cumulative lives share one normalised curve: one at a time
    if(t.checked&&t.id==="vis_cumly") document.getElementById("vis_cumlives").checked=false;
    if(t.checked&&t.id==="vis_cumlives") document.getElementById("vis_cumly").checked=false;
    applyParams(); });
  document.getElementById("reset").onclick=resetAll;

  // font-size slider: value bubble over the handle, the end values at the corners (see the .rslider CSS)
  function drawFontSlider(){ const box=document.querySelector(".rslider"); if(!box) return;
    const inp=box.querySelector("input"), val=box.querySelector(".rs-val"), bw0=box.clientWidth, TH=22;   // TH: handle width
    const lo=+inp.min, hi=+inp.max, cx=TH/2+(+inp.value-lo)/(hi-lo)*(bw0-TH);                         // handle centre
    inp.style.setProperty("--fill", cx+"px");
    box.querySelector(".rs-min").textContent=lo; box.querySelector(".rs-max").textContent=hi; val.textContent=inp.value;
    const bw=val.offsetWidth; val.style.left=Math.min(Math.max(cx,bw/2),bw0-bw/2)+"px";               // bubble stays inside the slider
    const vr=val.getBoundingClientRect();
    box.querySelectorAll(".rs-min, .rs-max").forEach(l=>{ const r=l.getBoundingClientRect();
      l.style.visibility=(r.right+3>vr.left&&r.left-3<vr.right)?"hidden":""; }); }
  document.getElementById("font").addEventListener("input", ()=>{ drawFontSlider(); applyParams(); });

  build({haz:HZ0, surv:SV0, W:W0, H:H0});
  applyParams();
  drawFontSlider();

  // Shown in an article's iframe: report the page's height whenever it changes, so the article can size the
  // frame to fit and the app never scrolls inside it. The article's side is written by tools/build_static.R
  // (inject_frame).
  if(window.parent!==window){ let postedH=0;
    const page=document.querySelector(".page");
    const postHeight=()=>{ const h=Math.ceil(page.getBoundingClientRect().height);
      if(h!==postedH){ postedH=h; window.parent.postMessage({appHeight:h}, "*"); } };
    if(window.ResizeObserver) new ResizeObserver(postHeight).observe(page);
    window.addEventListener("load", postHeight);
    postHeight(); }
})();
</script>
</body>
</html>
